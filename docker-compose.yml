version: '3.7'

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./schema:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  app:
    image: openjdk:11-jre-slim
    restart: always
    depends_on:
      - mysql
    ports:
      - "9999:9999"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/app?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USER: "app"
      DB_PASS: "pass"
    volumes:
      - ./artifacts:/artifacts
    working_dir: /artifacts
    command: java -jar app-deadline.jar -P:jdbc.url=jdbc:mysql://mysql:3306/app?allowPublicKeyRetrieval=true&useSSL=false -P:jdbc.user=app -P:jdbc.password=pass

volumes:
  mysql_data:
