name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew 2>/dev/null || true
    
    - name: Start MySQL
      run: |
        docker run -d --name mysql \
          -e MYSQL_DATABASE=app \
          -e MYSQL_USER=app \
          -e MYSQL_PASSWORD=pass \
          -e MYSQL_ROOT_PASSWORD=password \
          -p 3306:3306 \
          -v $PWD/schema:/docker-entrypoint-initdb.d \
          mysql:8.0 \
          --default-authentication-plugin=mysql_native_password
        sleep 30
    
    - name: Check database
      run: |
        docker exec mysql mysql -u app -ppass app -e "SHOW TABLES;"
        docker exec mysql mysql -u app -ppass app -e "SELECT * FROM users;"
    
    - name: Start application
      run: |
        if [ -f "artifacts/app-deadline.jar" ]; then
          java -jar artifacts/app-deadline.jar \
            -P:jdbc.url=jdbc:mysql://localhost:3306/app \
            -P:jdbc.user=app \
            -P:jdbc.password=pass &
          APP_PID=$!
          echo $APP_PID > app.pid
          sleep 15
        else
          echo "WARNING: app-deadline.jar not found"
        fi
    
    - name: Run tests
      run: ./gradlew test --no-daemon --stacktrace
      env:
        DB_URL: jdbc:mysql://localhost:3306/app
        DB_USER: app
        DB_PASS: pass
    
    - name: Cleanup
      if: always()
      run: |
        if [ -f "app.pid" ]; then
          kill $(cat app.pid) 2>/dev/null || true
          rm app.pid
        fi
        docker stop mysql 2>/dev/null || true
        docker rm mysql 2>/dev/null || true
