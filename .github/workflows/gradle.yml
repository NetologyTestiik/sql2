name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: pass
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        volumes:
          - ./schema:/docker-entrypoint-initdb.d

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Install Gradle 7.6
      run: |
        wget https://services.gradle.org/distributions/gradle-7.6-bin.zip
        sudo unzip -d /opt/gradle gradle-7.6-bin.zip
        echo "GRADLE_HOME=/opt/gradle/gradle-7.6" >> $GITHUB_ENV
        echo "/opt/gradle/gradle-7.6/bin" >> $GITHUB_PATH
    
    - name: Wait for MySQL to be ready
      run: sleep 30
    
    - name: Run tests with Gradle 7.6
      run: /opt/gradle/gradle-7.6/bin/gradle test --no-daemon
      env:
        DB_URL: jdbc:mysql://localhost:3306/app
        DB_USER: app
        DB_PASS: pass
