name: Java CI with Docker Compose

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew (if exists)
      run: chmod +x gradlew 2>/dev/null || true

    - name: Run docker-compose
     
      run: |
        docker-compose up -d
        sleep 30  # Даем время на запуск контейнеров

    - name: Check if containers are running
      run: docker-compose ps

    - name: Wait for application to start
      run: |
       
        for i in {1..30}; do
          if curl -f http://localhost:9999 2>/dev/null; then
            echo "Application is ready!"
            break
          fi
          echo "Waiting for application... ($i/30)"
          sleep 2
        done

    - name: Check database state (for debugging)
      run: |
       
        docker-compose exec -T mysql mysql -u app -ppass app -e "SHOW TABLES;"
        docker-compose exec -T mysql mysql -u app -ppass app -e "SELECT * FROM users;"

    - name: Run tests with Gradle
      run: |
       
        ./gradlew test --no-daemon --stacktrace
      env:
        DB_URL: jdbc:mysql://localhost:3306/app
        DB_USER: app
        DB_PASS: pass

    - name: Stop docker-compose
      if: always()  # Останавливаем контейнеры даже если тесты упали
      run: docker-compose down
