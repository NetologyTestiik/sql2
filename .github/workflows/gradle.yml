name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: pass
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        volumes:
          - ./schema:/docker-entrypoint-initdb.d

    steps:
    - uses: actions/checkout@v3
    
    - name: Remove BOM from all files
      run: |
        # РЈРґР°Р»СЏРµРј BOM РёР· РІСЃРµС… С‚РµРєСЃС‚РѕРІС‹С… С„Р°Р№Р»РѕРІ
        find . -type f \( -name "*.java" -o -name "*.gradle" -o -name "*.yml" -o -name "*.yaml" -o -name "*.md" -o -name "*.sql" -o -name "*.config" -o -name "*.properties" \) | while read file; do
          sed -i '1s/^\xEF\xBB\xBF//' "$file" 2>/dev/null || true
        done
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Install Gradle 7.6
      run: |
        wget https://services.gradle.org/distributions/gradle-7.6-bin.zip
        sudo unzip -d /opt/gradle gradle-7.6-bin.zip
        echo "GRADLE_HOME=/opt/gradle/gradle-7.6" >> $GITHUB_ENV
        echo "/opt/gradle/gradle-7.6/bin" >> $GITHUB_PATH
    
    - name: Wait for MySQL to be ready
      run: sleep 30

    - name: Check MySQL status
      run: |
        echo "=== MySQL Status ==="
        mysqladmin -h 127.0.0.1 -u root -ppassword ping
        echo "=== Database list ==="
        mysql -h 127.0.0.1 -u root -ppassword -e "SHOW DATABASES;"
        echo "=== App database tables ==="
        mysql -h 127.0.0.1 -u app -ppass app -e "SHOW TABLES;"
        echo "=== Users table content ==="
        mysql -h 127.0.0.1 -u app -ppass app -e "SELECT * FROM users;" || echo "No users table"

    
    - name: Run tests with Gradle 7.6
      run: /opt/gradle/gradle-7.6/bin/gradle test --no-daemon --stacktrace
      env:
        DB_URL: jdbc:mysql://localhost:3306/app
        DB_USER: app
        DB_PASS: pass
