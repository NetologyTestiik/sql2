name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Start MySQL
      run: |
        # Запускаем MySQL напрямую через docker
        docker run -d --name mysql \
          -e MYSQL_DATABASE=app \
          -e MYSQL_USER=app \
          -e MYSQL_PASSWORD=pass \
          -e MYSQL_ROOT_PASSWORD=password \
          -p 3306:3306 \
          -v $PWD/schema:/docker-entrypoint-initdb.d \
          mysql:8.0 \
          --default-authentication-plugin=mysql_native_password
        
        # Ждем инициализации
        echo "Waiting for MySQL..."
        sleep 30
    
    - name: Check MySQL
      run: |
        docker exec mysql mysql -u app -ppass app -e "SHOW TABLES;"
        docker exec mysql mysql -u app -ppass app -e "SELECT * FROM users;"
    
    - name: Start application
      run: |
        # Копируем jar в контейнер и запускаем
        if [ -f "artifacts/app-deadline.jar" ]; then
          echo "Starting application..."
          # Создаем временный Dockerfile
          cat > Dockerfile.app << 'EOF'
          FROM openjdk:11-jre-slim
          WORKDIR /app
          COPY artifacts/app-deadline.jar app.jar
          EXPOSE 9999
          CMD ["java", "-jar", "app.jar", 
               "-P:jdbc.url=jdbc:mysql://host.docker.internal:3306/app",
               "-P:jdbc.user=app", 
               "-P:jdbc.password=pass"]
          EOF
          
          docker build -f Dockerfile.app -t test-app .
          docker run -d --name app --add-host=host.docker.internal:host-gateway -p 9999:9999 test-app
          sleep 15
        else
          echo "WARNING: app-deadline.jar not found!"
        fi
    
    - name: Check application
      run: |
        curl -f http://localhost:9999 || echo "Application check failed"
        sleep 5
    
    - name: Run tests
      run: ./gradlew test --no-daemon --stacktrace
      env:
        DB_URL: jdbc:mysql://localhost:3306/app
        DB_USER: app
        DB_PASS: pass
    
    - name: Cleanup
      if: always()
      run: |
        docker stop mysql app 2>/dev/null || true
        docker rm mysql app 2>/dev/null || true
